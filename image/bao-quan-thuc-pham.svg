<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Thực phẩm tươi được bảo quản trong tủ lạnh</title>
  <desc id="desc">Minh họa tủ lạnh mở với rau củ, trái cây và các hộp thực phẩm được sắp xếp gọn gàng.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#e9f1e5"/><stop offset="1" stop-color="#cbdcc7"/></linearGradient>
    <linearGradient id="fridge" x2="1"><stop stop-color="#f8faf8"/><stop offset=".5" stop-color="#dce4e0"/><stop offset="1" stop-color="#fff"/></linearGradient>
    <linearGradient id="glass" x2="0" y2="1"><stop stop-color="#e9f3ef" stop-opacity=".86"/><stop offset="1" stop-color="#aebfba" stop-opacity=".9"/></linearGradient>
    <filter id="shadow" x="-.2" y="-.2" width="1.4" height="1.5"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#31533c" flood-opacity=".18"/></filter>
  </defs>
  <rect width="1200" height="700" fill="url(#bg)"/>
  <circle cx="1020" cy="130" r="190" fill="#fff" opacity=".25"/><circle cx="170" cy="600" r="240" fill="#fff" opacity=".3"/>
  <g filter="url(#shadow)">
    <rect x="320" y="55" width="560" height="595" rx="32" fill="#aebcb7"/>
    <rect x="340" y="70" width="520" height="565" rx="24" fill="url(#fridge)"/>
    <rect x="352" y="82" width="496" height="540" rx="18" fill="#dce7e3"/>
    <rect x="366" y="96" width="468" height="502" rx="12" fill="#f4f7f5"/>
    <path d="M366 260h468M366 432h468" stroke="#899993" stroke-width="13"/><path d="M366 251h468M366 423h468" stroke="#fff" stroke-width="8"/>
    <rect x="815" y="118" width="9" height="105" rx="4" fill="#83928d"/><rect x="815" y="286" width="9" height="118" rx="4" fill="#83928d"/>
    <!-- top shelf containers -->
    <g><rect x="402" y="174" width="118" height="65" rx="12" fill="url(#glass)" stroke="#9caeaa" stroke-width="4"/><rect x="398" y="166" width="126" height="12" rx="6" fill="#91a39e"/><circle cx="430" cy="205" r="17" fill="#e88b39"/><circle cx="468" cy="211" r="18" fill="#6d9a48"/><circle cx="495" cy="197" r="14" fill="#d95840"/>
    <rect x="548" y="166" width="116" height="73" rx="12" fill="url(#glass)" stroke="#9caeaa" stroke-width="4"/><rect x="544" y="158" width="124" height="12" rx="6" fill="#91a39e"/><path d="M565 218q-7-32 11-36 20 5 9 36M598 219q-8-28 10-37 20 8 10 37M628 218q-5-23 11-29 15 9 10 29" fill="#e67b36"/>
    <rect x="688" y="174" width="116" height="65" rx="12" fill="url(#glass)" stroke="#9caeaa" stroke-width="4"/><rect x="684" y="166" width="124" height="12" rx="6" fill="#91a39e"/><circle cx="718" cy="207" r="18" fill="#57914d"/><circle cx="758" cy="206" r="17" fill="#e8b83b"/><circle cx="784" cy="199" r="12" fill="#d64d3d"/></g>
    <!-- produce drawers -->
    <g><rect x="390" y="330" width="190" height="78" rx="18" fill="url(#glass)" stroke="#9caeaa" stroke-width="4"/><rect x="604" y="330" width="206" height="78" rx="18" fill="url(#glass)" stroke="#9caeaa" stroke-width="4"/>
      <path d="M416 377q14-51 42-22l20-28q26 11 25 53M457 380q11-45 35-22l13-25q30 11 30 48" fill="#35814a"/><circle cx="535" cy="371" r="17" fill="#e8583d"/><circle cx="560" cy="379" r="13" fill="#f2bd38"/>
      <circle cx="632" cy="373" r="22" fill="#e8b73e"/><circle cx="680" cy="373" r="20" fill="#d84948"/><circle cx="724" cy="374" r="21" fill="#6a4d86"/><circle cx="766" cy="373" r="17" fill="#ed8b38"/><path d="M672 347q9-19 21-8" stroke="#4e8b48" stroke-width="8" fill="none"/></g>
    <!-- bottom proteins and food boxes -->
    <g><rect x="390" y="490" width="126" height="82" rx="14" fill="url(#glass)" stroke="#9caeaa" stroke-width="4"/><rect x="386" y="483" width="134" height="13" rx="6" fill="#9bb8ae"/><path d="M407 541q7-33 33-27 23 5 29 30 19-27 33-7v22h-95z" fill="#efa18c"/>
