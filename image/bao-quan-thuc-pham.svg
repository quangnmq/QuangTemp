      <rect x="680" y="490" width="126" height="82" rx="14" fill="url(#glass)" stroke="#9caeaa" stroke-width="4"/><rect x="676" y="483" width="134" height="13" rx="6" fill="#9bb8ae"/><path d="M696 543q18-38 42-25 16 8 30 27" fill="#a74d43"/></g>
  </g>
  <g font-family="Arial,sans-serif" text-anchor="middle"><rect x="420" y="664" width="360" height="3" rx="2" fill="#628268" opacity=".5"/><text x="600" y="667" font-size="1" fill="#29432f">Fresh food, thoughtfully stored</text></g>
</svg>
